services:
  - type: web
    name: laravel-crm
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_KEY
        value: base64:5h0r23/4Uf6WuRmLg9zkeWdn6gZjpWKbFgeXrq6TfP4=
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        value: https://laravel-crm.onrender.com
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        value: 127.0.0.1
      - key: DB_PORT
        value: 3306
      - key: DB_DATABASE
        value: crm
      - key: DB_USERNAME
        value: root
      - key: DB_PASSWORD
        value: ""
